name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation
        run: |
          pnpm --filter @tlao/docs run lint
          pnpm --filter @tlao/docs run type-check
          pnpm --filter @tlao/docs exec jest --runInBand

      - name: Build landing page
        run: pnpm --filter @tlao/landing run build

      - name: Build documentation site
        run: pnpm --filter @tlao/docs run build:github

      - name: Combine builds
        run: |
          mkdir -p combined-build
          cp -a apps/landing/out/. combined-build/
          mkdir -p combined-build/documentation
          cp -a apps/docs/build/. combined-build/documentation/
          touch combined-build/.nojekyll
          test -s combined-build/index.html
          test -s combined-build/documentation/index.html
          test -s combined-build/documentation/mail/smtp-imap/index.html
          test -s combined-build/documentation/mail/passwords/index.html
          test -s combined-build/documentation/es/index.html
          test -s combined-build/documentation/es/mail/smtp-imap/index.html
          test -s combined-build/documentation/es/mail/passwords/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'combined-build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
